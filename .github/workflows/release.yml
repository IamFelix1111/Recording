name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}  # manual run: build + sign + artifact, no Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            zip

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Sign exe (skipped unless CERT_PFX_B64/CERT_PFX_PASS secrets exist)
        shell: pwsh
        env:
          CERT_PFX_B64: ${{ secrets.CERT_PFX_B64 }}
          CERT_PFX_PASS: ${{ secrets.CERT_PFX_PASS }}
        run: |
          if (-not $env:CERT_PFX_B64) { "No signing certificate configured - skipping"; exit 0 }
          [IO.File]::WriteAllBytes("$PWD\cert.pfx", [Convert]::FromBase64String($env:CERT_PFX_B64))
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new("$PWD\cert.pfx", $env:CERT_PFX_PASS)
          $sig = Set-AuthenticodeSignature -FilePath build/RecordingGui.exe -Certificate $cert -TimestampServer http://timestamp.digicert.com -HashAlgorithm SHA256
          Remove-Item cert.pfx -Force
          if (-not $sig.SignerCertificate) { "Signing FAILED: $($sig.Status) $($sig.StatusMessage)"; exit 1 }
          "Signed by: $($sig.SignerCertificate.Subject)"

      - name: Package
        run: |
          mkdir -p package
          cp build/RecordingGui.exe package/
          cp RELEASE.md package/README.md
          cp LICENSE package/
          zip -r "Recording-${GITHUB_REF_NAME}-win64.zip" package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Recording-${{ github.ref_name }}-win64
          path: Recording-*-win64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Recording-*-win64.zip
          generate_release_notes: true
          # Tags with a hyphen (v0.1.0-test / -rc1 / -beta) publish as pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
